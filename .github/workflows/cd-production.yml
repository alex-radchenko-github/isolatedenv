name: CD Production

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }},ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend

          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }},ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Deploy
        run: |
          echo "Add deployment commands here (SSH, kubectl, docker compose pull, etc.)"
          echo "Tag: ${{ github.ref_name }}"

      - name: Smoke test
        run: |
          echo "Add smoke tests here (curl health endpoint, run e2e, etc.)"
