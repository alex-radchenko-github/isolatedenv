name: CD Staging

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend

          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Deploy to staging
        run: |
          echo "Deploy to staging -- configure with your deployment tool"
          echo "Options: SSH + docker compose pull, kubectl set image, Coolify webhook"
          echo "Example: ssh staging 'cd /app && docker compose pull && docker compose up -d'"
