name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install ruff
      - name: Ruff check
        run: ruff check backend/
      - name: Ruff format check
        run: ruff format --check backend/

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli -a test_redis_pass ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        env:
          REDIS_ARGS: "--requirepass test_redis_pass"
    env:
      DATABASE_URL: "postgresql+asyncpg://test_user:test_password@localhost:5432/test_db"
      DATABASE_URL_SYNC: "postgresql://test_user:test_password@localhost:5432/test_db"
      REDIS_URL: "redis://:test_redis_pass@localhost:6379/0"
      REDIS_CACHE_URL: "redis://:test_redis_pass@localhost:6379/1"
      REDIS_RESULT_URL: "redis://:test_redis_pass@localhost:6379/2"
      AUTHENTIK_CLIENT_ID: "test"
      AUTHENTIK_CLIENT_SECRET: "test"
      JWKS_URL: "http://localhost/.well-known/jwks.json"
      OIDC_ISSUER: "http://localhost/application/o/test/"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest pytest-asyncio httpx
      - name: Run tests
        run: pytest backend/tests/ -v


  lint-web:
    name: Lint Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Lint
        run: pnpm lint
        working-directory: frontend

      - name: Type check
        run: pnpm tsc --noEmit
        working-directory: frontend



  test-migrations:
    name: Test Migrations
    runs-on: ubuntu-latest
    needs: [lint-backend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql+asyncpg://test_user:test_password@localhost:5432/test_db"
      DATABASE_URL_SYNC: "postgresql://test_user:test_password@localhost:5432/test_db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Test migrations (up → down → up)
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

  build-docker:
    name: Build & Scan Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan backend image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: backend:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend

          push: false
          load: true
          tags: frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan frontend image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: frontend:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

