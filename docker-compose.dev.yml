# Dev overrides: hot reload, exposed ports, volume mounts
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Ports are configurable via .env (API_PORT, FRONTEND_PORT, DB_PORT, REDIS_PORT)
services:
  db:
    ports:
      - "${DB_PORT:-5442}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6389}:6379"

  authentik-server:
    ports:
      - "${AUTHENTIK_PORT:-9010}:9000"

  backend:
    ports:
      - "${API_PORT:-8010}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DEBUG: "true"
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
        - action: rebuild
          path: ./backend/requirements.txt


  frontend:
    ports:
      - "${FRONTEND_PORT:-3010}:3000"
    build:
      target: dev
    volumes:
      # Mount source for hot reload; preserve container node_modules and .next
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
    deploy:
      resources:
        limits:
          memory: 2G
    develop:
      watch:
        - action: sync
          path: ./frontend/src

          target: /app/src
        - action: rebuild
          path: ./frontend/package.json


