# Production-ready base compose file
# Dev: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-backend-env: &backend-env
  DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/isolatedenv"
  DATABASE_URL_SYNC: "postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/isolatedenv"
  REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
  REDIS_CACHE_URL: "redis://:${REDIS_PASSWORD}@redis:6379/1"
  REDIS_RESULT_URL: "redis://:${REDIS_PASSWORD}@redis:6379/3"
  AUTHENTIK_URL: "http://authentik-server:9000"
  AUTHENTIK_CLIENT_ID: "${AUTHENTIK_CLIENT_ID}"
  AUTHENTIK_CLIENT_SECRET: "${AUTHENTIK_CLIENT_SECRET}"
  JWKS_URL: "http://authentik-server:9000/application/o/isolatedenv/jwks/"
  # Must match the JWT "iss" claim — frontend uses internal URL for OIDC discovery,
  # so the JWT issuer is the internal Authentik hostname.
  OIDC_ISSUER: "http://authentik-server:9000/application/o/isolatedenv/"

x-authentik-env: &authentik-env
  AUTHENTIK_SECRET_KEY: "${AUTHENTIK_SECRET_KEY}"
  AUTHENTIK_REDIS__HOST: redis
  AUTHENTIK_REDIS__DB: 2
  AUTHENTIK_REDIS__PASSWORD: "${REDIS_PASSWORD}"
  AUTHENTIK_POSTGRESQL__HOST: db
  AUTHENTIK_POSTGRESQL__USER: authentik
  AUTHENTIK_POSTGRESQL__NAME: authentik
  AUTHENTIK_POSTGRESQL__PASSWORD: "${AUTHENTIK_DB_PASSWORD}"
  AUTHENTIK_BOOTSTRAP_PASSWORD: "${AUTHENTIK_BOOTSTRAP_PASSWORD}"
  AUTHENTIK_BOOTSTRAP_EMAIL: "${AUTHENTIK_BOOTSTRAP_EMAIL:-akadmin@localhost}"
  AUTHENTIK_BOOTSTRAP_TOKEN: "${AUTHENTIK_BOOTSTRAP_TOKEN}"

services:
  # === APP SERVICES ===
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "idle_in_transaction_session_timeout=60000"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "log_min_duration_statement=500"  # milliseconds — logs queries slower than 500ms
    environment:
      POSTGRES_DB: isolatedenv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_DB_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d isolatedenv"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - backend-network

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy volatile-lru --appendonly yes --appendfsync everysec
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - backend-network

  backend:
    build: ./backend
    image: ${COMPOSE_PROJECT_NAME:-isolatedenv}-backend:latest
    restart: unless-stopped
    logging: *default-logging
    # Uvicorn --timeout-graceful-shutdown must be < stop_grace_period (currently 25s in entrypoint.sh)
    # so the process exits cleanly before Docker sends SIGKILL.
    stop_grace_period: 30s
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      authentik-server: { condition: service_healthy }
    environment:
      <<: *backend-env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - frontend-network
      - backend-network

  celery-worker:
    image: ${COMPOSE_PROJECT_NAME:-isolatedenv}-backend:latest
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *backend-env
    command: celery -A app.core.celery_app worker -l info -Q celery,default,maintenance
    healthcheck:
      test: ["CMD", "celery", "-A", "app.core.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - backend-network

  celery-beat:
    image: ${COMPOSE_PROJECT_NAME:-isolatedenv}-backend:latest
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *backend-env
    command: celery -A app.core.celery_app beat -l info --schedule /var/lib/celery/celerybeat-schedule
    volumes:
      - celerybeat-schedule:/var/lib/celery
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
    networks:
      - backend-network


  frontend:
    build:
      context: ./frontend

      target: runner
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Server-side (SSR): use Docker internal hostnames
      API_URL: "http://backend:8000"
      AUTHENTIK_URL: "http://authentik-server:9000"
      AUTHENTIK_CLIENT_ID: "${AUTHENTIK_CLIENT_ID}"
      AUTHENTIK_CLIENT_SECRET: "${AUTHENTIK_CLIENT_SECRET}"
      OIDC_ISSUER: "http://authentik-server:9000/application/o/isolatedenv/"
      # App origin for OIDC redirect_uri (must match external port)
      APP_ORIGIN: "http://localhost:${FRONTEND_PORT:-3010}"
      # Public (browser): use exposed localhost ports
      NEXT_PUBLIC_API_URL: "http://localhost:${API_PORT:-8010}"
      NEXT_PUBLIC_AUTHENTIK_URL: "http://localhost:${AUTHENTIK_PORT:-9010}"
      NEXT_PUBLIC_AUTHENTIK_CLIENT_ID: "${AUTHENTIK_CLIENT_ID}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)throw r.status}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - frontend-network


  # === AUTHENTIK SERVICES (2026.2) ===
  authentik-server:
    image: ghcr.io/goauthentik/server:2026.2
    container_name: isolatedenv-authentik-server
    command: server
    logging: *default-logging
    environment:
      <<: *authentik-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend-network
      - backend-network
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.2
    container_name: isolatedenv-authentik-worker
    command: worker
    logging: *default-logging
    environment:
      <<: *authentik-env
    depends_on:
      authentik-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - backend-network
    restart: unless-stopped

  # === SEED SERVICE ===
  seed:
    profiles: ["seed"]
    build: ./backend
    depends_on:
      authentik-server: { condition: service_healthy }
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/isolatedenv"
      DATABASE_URL_SYNC: "postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/isolatedenv"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      REDIS_CACHE_URL: "redis://:${REDIS_PASSWORD}@redis:6379/1"
      REDIS_RESULT_URL: "redis://:${REDIS_PASSWORD}@redis:6379/3"
      AUTHENTIK_URL: "http://authentik-server:9000"
      AUTHENTIK_BOOTSTRAP_PASSWORD: "${AUTHENTIK_BOOTSTRAP_PASSWORD}"
      AUTHENTIK_BOOTSTRAP_TOKEN: "${AUTHENTIK_BOOTSTRAP_TOKEN}"
      AUTHENTIK_BOOTSTRAP_EMAIL: "${AUTHENTIK_BOOTSTRAP_EMAIL:-akadmin@localhost}"
      AUTHENTIK_POSTGRESQL__HOST: db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: "${AUTHENTIK_DB_PASSWORD}"
      AUTHENTIK_CLIENT_ID: "${AUTHENTIK_CLIENT_ID}"
      AUTHENTIK_CLIENT_SECRET: "${AUTHENTIK_CLIENT_SECRET}"
      AUTHENTIK_EXTERNAL_URL: "http://localhost:${AUTHENTIK_PORT:-9010}"
      PROJECT_SLUG: "isolatedenv"
    volumes:
      - ./scripts:/scripts:ro
    command: python /scripts/seed.py
    restart: "no"
    networks:
      - backend-network

volumes:
  pgdata:
  redisdata:
  celerybeat-schedule:

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
